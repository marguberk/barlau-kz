<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ GPS Тест - Мониторинг координат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .gps-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .gps-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #3b82f6;
        }
        
        .info-item h3 {
            color: #1e40af;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .info-item .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
        }
        
        .coordinates {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        
        .coordinates h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .coordinates .coords {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .map-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .map-container h3 {
            color: #1e40af;
            margin-bottom: 15px;
            text-align: center;
        }
        
        #map {
            height: 400px;
            border-radius: 15px;
            border: 2px solid #e5e7eb;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .log {
            background: #1f2937;
            color: #f9fafb;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px 0;
            border-bottom: 1px solid #374151;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .timestamp {
            color: #6b7280;
        }
        
        .error {
            color: #f87171;
        }
        
        .success {
            color: #34d399;
        }
        
        .warning {
            color: #fbbf24;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛰️ GPS Тест</h1>
            <p>Мониторинг координат грузовика 484 ATL 01 в реальном времени</p>
        </div>
        
        <div class="gps-card">
            <div class="coordinates">
                <h2>📍 Текущие координаты</h2>
                <div class="coords" id="coordinates">Загрузка...</div>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Подключение...</span>
                </div>
            </div>
            
            <div class="gps-info">
                <div class="info-item">
                    <h3>🚛 Грузовик</h3>
                    <div class="value" id="vehicleInfo">484 ATL 01</div>
                </div>
                
                <div class="info-item">
                    <h3>📱 Device ID</h3>
                    <div class="value" id="deviceId">-</div>
                </div>
                
                <div class="info-item">
                    <h3>🛰️ GPS Статус</h3>
                    <div class="value" id="gpsStatus">-</div>
                </div>
                
                <div class="info-item">
                    <h3>⏰ Последнее обновление</h3>
                    <div class="value" id="lastUpdate">-</div>
                </div>
                
                <div class="info-item">
                    <h3>🚗 Скорость</h3>
                    <div class="value" id="speed">-</div>
                </div>
                
                <div class="info-item">
                    <h3>⛽ Топливо</h3>
                    <div class="value" id="fuel">-</div>
                </div>
            </div>
        </div>
        
        <div class="map-container">
            <h3>🗺️ Карта местоположения</h3>
            <div id="map"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="startMonitoring()">▶️ Запустить мониторинг</button>
            <button class="btn btn-success" onclick="updateOnce()">🔄 Обновить сейчас</button>
            <button class="btn btn-danger" onclick="stopMonitoring()">⏹️ Остановить</button>
        </div>
        
        <div class="gps-card">
            <h3>📋 Лог обновлений</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let marker;
        let monitoringInterval;
        let isMonitoring = false;
        
        // Инициализация карты
        function initMap() {
            map = L.map('map').setView([43.222000, 76.851200], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            // Добавляем маркер
            marker = L.marker([43.222000, 76.851200]).addTo(map);
            marker.bindPopup('🚛 Грузовик 484 ATL 01').openPopup();
        }
        
        // Логирование
        function log(message, type = 'info') {
            const logContainer = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // Обновление GPS данных
        async function updateGPSData() {
            try {
                log('🔄 Запрос GPS данных...', 'info');
                
                const response = await fetch('/api/vehicles/9/');
                const data = await response.json();
                
                if (response.ok) {
                    // Обновляем координаты
                    const lat = data.gps_latitude;
                    const lng = data.gps_longitude;
                    
                    if (lat && lng) {
                        document.getElementById('coordinates').textContent = `${lat}, ${lng}`;
                        document.getElementById('deviceId').textContent = data.gps_device_id || '-';
                        document.getElementById('gpsStatus').textContent = data.gps_enabled ? '✅ Включен' : '❌ Выключен';
                        document.getElementById('lastUpdate').textContent = data.gps_last_update || 'Не обновлялось';
                        document.getElementById('speed').textContent = data.gps_speed ? `${data.gps_speed} км/ч` : '-';
                        document.getElementById('fuel').textContent = data.gps_fuel_level ? `${data.gps_fuel_level}%` : '-';
                        
                        // Обновляем карту
                        if (map && marker) {
                            const newLatLng = [parseFloat(lat), parseFloat(lng)];
                            marker.setLatLng(newLatLng);
                            map.setView(newLatLng, 13);
                        }
                        
                        // Обновляем статус
                        document.getElementById('statusDot').style.background = '#10b981';
                        document.getElementById('statusText').textContent = '✅ Данные получены';
                        
                        log(`✅ GPS данные обновлены: ${lat}, ${lng}`, 'success');
                    } else {
                        document.getElementById('coordinates').textContent = 'Координаты не найдены';
                        document.getElementById('statusDot').style.background = '#fbbf24';
                        document.getElementById('statusText').textContent = '⚠️ Нет координат';
                        
                        log('⚠️ GPS координаты не найдены', 'warning');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
            } catch (error) {
                log(`❌ Ошибка получения GPS данных: ${error.message}`, 'error');
                document.getElementById('statusDot').style.background = '#ef4444';
                document.getElementById('statusText').textContent = '❌ Ошибка подключения';
            }
        }
        
        // Запуск мониторинга
        function startMonitoring() {
            if (isMonitoring) return;
            
            isMonitoring = true;
            log('▶️ Запуск мониторинга GPS данных каждые 5 секунд', 'success');
            
            // Обновляем сразу
            updateGPSData();
            
            // Запускаем периодическое обновление
            monitoringInterval = setInterval(updateGPSData, 5000);
        }
        
        // Остановка мониторинга
        function stopMonitoring() {
            if (!isMonitoring) return;
            
            isMonitoring = false;
            clearInterval(monitoringInterval);
            log('⏹️ Мониторинг остановлен', 'warning');
            
            document.getElementById('statusDot').style.background = '#6b7280';
            document.getElementById('statusText').textContent = '⏹️ Остановлено';
        }
        
        // Однократное обновление
        function updateOnce() {
            log('🔄 Однократное обновление GPS данных', 'info');
            updateGPSData();
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            log('🚀 GPS тестовая страница загружена', 'success');
            log('💡 Нажмите "Запустить мониторинг" для начала отслеживания', 'info');
        });
        
        // Очистка при закрытии страницы
        window.addEventListener('beforeunload', function() {
            if (isMonitoring) {
                stopMonitoring();
            }
        });
    </script>
</body>
</html>
