{% extends 'core/base.html' %}
{% load static %}

{% block title %}Создать заезд - BARLAU.KZ{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Создать новый заезд</h1>
        
                            <form method="post" class="space-y-6" id="create-trip-form">
                        {% csrf_token %}
            
            <!-- Название -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Название заезда *</label>
                <input type="text" id="title" name="title" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Введите название заезда">
            </div>
            
            <!-- Статус -->
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 mb-2">Статус</label>
                <select id="status" name="status"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="PLANNED">Запланирована</option>
                    <option value="READY">Готова к отправке</option>
                </select>
            </div>
            
            <!-- Грузовик -->
            <div>
                <label for="vehicle" class="block text-sm font-medium text-gray-700 mb-2">Грузовик *</label>
                <select id="vehicle" name="vehicle" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Выберите грузовик</option>
                    {% for vehicle in vehicles %}
                        <option value="{{ vehicle.id }}">{{ vehicle.brand }} {{ vehicle.model }} ({{ vehicle.number }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Водитель -->
            <div>
                <label for="driver" class="block text-sm font-medium text-gray-700 mb-2">Водитель *</label>
                <select id="driver" name="driver" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Выберите водителя</option>
                    {% for driver in drivers %}
                        <option value="{{ driver.id }}">{{ driver.first_name }} {{ driver.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Адреса -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="start_address" class="block text-sm font-medium text-gray-700 mb-2">Адрес отправления *</label>
                    <input type="text" id="start_address" name="start_address" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Адрес отправления">
                </div>
                <div>
                    <label for="end_address" class="block text-sm font-medium text-gray-700 mb-2">Адрес назначения *</label>
                    <input type="text" id="end_address" name="end_address" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Адрес назначения">
                </div>
            </div>
            
            <!-- Даты -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="planned_start_date" class="block text-sm font-medium text-gray-700 mb-2">Дата начала *</label>
                    <input type="datetime-local" id="planned_start_date" name="planned_start_date" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="planned_end_date" class="block text-sm font-medium text-gray-700 mb-2">Дата окончания</label>
                    <input type="datetime-local" id="planned_end_date" name="planned_end_date"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <!-- Примечания -->
            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Примечания</label>
                <textarea id="notes" name="notes" rows="3"
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                          placeholder="Дополнительная информация..."></textarea>
            </div>
            
            <!-- Кнопки -->
            <div class="flex justify-end gap-4">
                <a href="{% url 'core:trips' %}" 
                   class="px-6 py-3 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Отмена
                </a>
                <button type="submit" 
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Создать заезд
                </button>
            </div>
        </form>
        
        {% if message %}
            <div class="mt-6 p-4 rounded-lg {% if success %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
                {{ message }}
            </div>
        {% endif %}
    </div>
</div>

            <script>
            // Устанавливаем текущую дату и время по умолчанию
            document.addEventListener('DOMContentLoaded', function() {
                const now = new Date();
                const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                document.getElementById('planned_start_date').value = localDateTime;
                
                // Обработчик отправки формы
                const form = document.getElementById('create-trip-form');
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const formData = new FormData(form);
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.textContent;
                    
                    // Показываем загрузку
                    submitBtn.textContent = 'Создание...';
                    submitBtn.disabled = true;
                    
                    fetch(window.location.href, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Показываем сообщение об успехе
                            const messageDiv = document.createElement('div');
                            messageDiv.className = 'mt-6 p-4 rounded-lg bg-green-100 text-green-800';
                            messageDiv.textContent = data.message;
                            form.parentNode.insertBefore(messageDiv, form.nextSibling);
                            
                            // Очищаем форму
                            form.reset();
                            document.getElementById('planned_start_date').value = localDateTime;
                            
                            // Обновляем список заездов на странице trips
                            if (window.opener && window.opener.location.pathname.includes('/trips/')) {
                                window.opener.location.reload();
                            }
                            
                            // Перенаправляем на страницу заездов через 2 секунды
                            setTimeout(() => {
                                window.location.href = '/dashboard/trips/';
                            }, 2000);
                        } else {
                            throw new Error(data.message || 'Ошибка создания заезда');
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        const messageDiv = document.createElement('div');
                        messageDiv.className = 'mt-6 p-4 rounded-lg bg-red-100 text-red-800';
                        messageDiv.textContent = 'Ошибка создания заезда: ' + error.message;
                        form.parentNode.insertBefore(messageDiv, form.nextSibling);
                    })
                    .finally(() => {
                        // Восстанавливаем кнопку
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    });
                });
            });
            </script>
{% endblock %}
