
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ GPS Мониторинг - 484 ATL 01</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            color: #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .coordinates {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .coordinates h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .coords {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #3b82f6;
        }
        .info-item h3 {
            color: #1e40af;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .info-item .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1f2937;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .log {
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 3px;
            padding: 2px 0;
        }
        .timestamp {
            color: #6b7280;
        }
        .success { color: #34d399; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛰️ GPS Мониторинг</h1>
            <p>Грузовик 484 ATL 01 - Обновление каждые 5 секунд</p>
        </div>
        
        <div class="coordinates">
            <h2>📍 Текущие координаты</h2>
            <div class="coords" id="coordinates">Загрузка...</div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Подключение...</span>
            </div>
        </div>
        
        <div class="info-grid">
            <div class="info-item">
                <h3>🚛 Грузовик</h3>
                <div class="value">484 ATL 01</div>
            </div>
            <div class="info-item">
                <h3>📱 Device ID</h3>
                <div class="value" id="deviceId">-</div>
            </div>
            <div class="info-item">
                <h3>🛰️ GPS Статус</h3>
                <div class="value" id="gpsStatus">-</div>
            </div>
            <div class="info-item">
                <h3>⏰ Обновление</h3>
                <div class="value" id="lastUpdate">-</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="startMonitoring()">▶️ Запустить</button>
            <button class="btn btn-success" onclick="updateOnce()">🔄 Обновить</button>
            <button class="btn btn-danger" onclick="stopMonitoring()">⏹️ Остановить</button>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let monitoringInterval;
        let isMonitoring = false;
        
        function log(message, type = 'info') {
            const logContainer = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        async function updateGPSData() {
            try {
                log('🔄 Запрос GPS данных...', 'info');
                
                const response = await fetch('https://barlau.org/api/vehicles/9/');
                const data = await response.json();
                
                if (response.ok) {
                    const lat = data.gps_latitude;
                    const lng = data.gps_longitude;
                    
                    if (lat && lng) {
                        document.getElementById('coordinates').textContent = `${lat}, ${lng}`;
                        document.getElementById('deviceId').textContent = data.gps_device_id || '-';
                        document.getElementById('gpsStatus').textContent = data.gps_enabled ? '✅ Включен' : '❌ Выключен';
                        document.getElementById('lastUpdate').textContent = data.gps_last_update || 'Не обновлялось';
                        
                        document.getElementById('statusDot').style.background = '#10b981';
                        document.getElementById('statusText').textContent = '✅ Данные получены';
                        
                        log(`✅ GPS данные: ${lat}, ${lng}`, 'success');
                    } else {
                        document.getElementById('coordinates').textContent = 'Координаты не найдены';
                        document.getElementById('statusDot').style.background = '#fbbf24';
                        document.getElementById('statusText').textContent = '⚠️ Нет координат';
                        
                        log('⚠️ GPS координаты не найдены', 'warning');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
                
            } catch (error) {
                log(`❌ Ошибка: ${error.message}`, 'error');
                document.getElementById('statusDot').style.background = '#ef4444';
                document.getElementById('statusText').textContent = '❌ Ошибка подключения';
            }
        }
        
        function startMonitoring() {
            if (isMonitoring) return;
            
            isMonitoring = true;
            log('▶️ Запуск мониторинга каждые 5 секунд', 'success');
            
            updateGPSData();
            monitoringInterval = setInterval(updateGPSData, 5000);
        }
        
        function stopMonitoring() {
            if (!isMonitoring) return;
            
            isMonitoring = false;
            clearInterval(monitoringInterval);
            log('⏹️ Мониторинг остановлен', 'warning');
            
            document.getElementById('statusDot').style.background = '#6b7280';
            document.getElementById('statusText').textContent = '⏹️ Остановлено';
        }
        
        function updateOnce() {
            log('🔄 Однократное обновление', 'info');
            updateGPSData();
        }
        
        // Автозапуск при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 GPS мониторинг загружен', 'success');
            setTimeout(() => {
                startMonitoring();
            }, 1000);
        });
        
        window.addEventListener('beforeunload', function() {
            if (isMonitoring) {
                stopMonitoring();
            }
        });
    </script>
</body>
</html>
